<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39E58C" />
      <stop offset="100%" stop-color="#8AF5B5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F0D" stroke="#39E58C" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Subtle Grid Accent -->
  <path d="M12 20h40M12 32h40M12 44h40M20 12v40M32 12v40M44 12v40" stroke="#39E58C" stroke-width="0.5" stroke-opacity="0.15" />
  
  <!-- AKK Monogram Glyph -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" filter="url(#glow)">
    <text x="32" y="39" text-anchor="middle" fill="url(#akGrad)">AKK</text>
  </g>

  <!-- Glowing indicator dot -->
  <circle cx="50" cy="14" r="3" fill="#39E58C" />
</svg>