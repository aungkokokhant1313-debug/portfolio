<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="akkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="akkGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#818CF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Clean, bold geometric shape with transparent background -->
  <!-- Left wing of 'A' & 'K' -->
  <path d="M12 48L24 14C24.5 12.5 26.5 12.5 27 14L32 28L22 48H12Z" fill="url(#akkGradient)" filter="url(#glow)" />
  
  <!-- Central crossbar / dynamic polygon -->
  <path d="M22 36H42L37 48H18L22 36Z" fill="url(#akkGradient2)" />

  <!-- Right diagonal strokes forming 'K' and finishing the mark -->
  <path d="M34 14L50 48H39L29 27L34 14Z" fill="url(#akkGradient)" />
  <path d="M35 32L49 14H40L29 28L35 32Z" fill="url(#akkGradient2)" filter="url(#glow)" />

  <!-- Accent geometric dot -->
  <circle cx="51" cy="46" r="3.5" fill="#38BDF8" />
</svg>